AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Vendor Sync — ECS Express Mode + RDS. Provisions everything Express Mode
  itself doesn't (RDS, ECR, IAM roles) into your account's default VPC.
  The Express Mode service itself is created by a CLI call afterward
  (deploy/aws/create-express-service.sh) — there's no CloudFormation
  resource type for it yet, since it's a very new AWS feature.

Parameters:
  ServiceName:
    Type: String
    Default: vendor-sync-express
    Description: Used to name/tag every resource in this stack.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      Your account's default VPC — Express Mode uses this automatically
      when you don't pass --network-configuration, so RDS needs to live
      here too. Find it: aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId"

  VpcCidr:
    Type: String
    Description: >
      CIDR block of the VPC above — RDS's security group allows Postgres
      from this whole range, since the Fargate tasks' security group is
      created automatically by Express Mode and its ID isn't known ahead
      of time. Find it: aws ec2 describe-vpcs --vpc-ids <VpcId> --query "Vpcs[0].CidrBlock"

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      At least 2 public subnets from the VPC above, in different AZs.
      Find them: aws ec2 describe-subnets --filters Name=vpc-id,Values=<VpcId> --query "Subnets[].SubnetId"

  DbInstanceClass:
    Type: String
    Default: db.t3.micro

  DbName:
    Type: String
    Default: vendor_sync

  DbUsername:
    Type: String
    Default: vendor_app

  DbAllocatedStorage:
    Type: Number
    Default: 20

  DbBackupRetentionPeriod:
    Type: Number
    Default: 0
    Description: >
      Days of automated RDS backups to retain. Defaults to 0 (disabled)
      because some free-tier/restricted AWS accounts cap this below the
      usual max of 7 — bump it up once you're off a constrained account.
      Note this is separate from the final snapshot this stack always
      takes on delete (DeletionPolicy: Snapshot on the Database resource).

  ShopifyApiSecretArn:
    Type: String
    Description: >
      ARN of a pre-created Secrets Manager secret holding the Shopify
      app's Client Secret:
      aws secretsmanager create-secret --name vendor-sync/shopify-api-secret --secret-string "..."

Resources:
  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ServiceName} RDS - Postgres from anywhere in the VPC"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VpcCidr
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ServiceName} DB subnets"
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref RdsSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: !Ref DbBackupRetentionPeriod
      StorageEncrypted: true

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ServiceName
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Expire untagged images after 7 days",
              "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7 },
              "action": { "type": "expire" }
            }]
          }

  # Lets ECS pull the image and resolve `secrets` (DB creds + Shopify
  # secret) into the container's environment at start time.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadAppSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref ShopifyApiSecretArn

  # Lets Express Mode itself provision/manage the ALB, target group,
  # security groups, and auto-scaling on your behalf.
  InfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-infra-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices

Outputs:
  EcrRepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  InfrastructureRoleArn:
    Value: !GetAtt InfrastructureRole.Arn
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabasePort:
    Value: !GetAtt Database.Endpoint.Port
  DatabaseSecretArn:
    Description: RDS-managed master credentials (auto-created, auto-rotatable).
    Value: !GetAtt Database.MasterUserSecret.SecretArn
