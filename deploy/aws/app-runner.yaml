AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Vendor Sync — ECR repository + App Runner service. Runs the Docker image
  built by CI, pulling DATABASE_URL and the Shopify API secret from Secrets
  Manager at container start rather than storing them in plaintext.

Parameters:
  ServiceName:
    Type: String
    Default: vendor-sync
    Description: Name for the ECR repository and App Runner service.

  ImageTag:
    Type: String
    Default: latest
    Description: >
      Tag App Runner watches for auto-deploy. CI should push to this same
      tag on every deploy.

  Cpu:
    Type: String
    Default: "0.25 vCPU"
    AllowedValues: ["0.25 vCPU", "0.5 vCPU", "1 vCPU", "2 vCPU", "4 vCPU"]

  Memory:
    Type: String
    Default: "0.5 GB"
    AllowedValues: ["0.5 GB", "1 GB", "2 GB", "3 GB", "4 GB", "6 GB", "8 GB", "10 GB", "12 GB"]

  ShopifyApiKey:
    Type: String
    Description: >
      Shopify app's Client ID (public — matches client_id in
      shopify.app.toml, not a secret).

  Scopes:
    Type: String
    Default: "read_products,write_products,read_inventory,write_inventory,read_locations,write_files"
    Description: Comma-separated access scopes, matching shopify.app.toml.

  ShopifyAppUrl:
    Type: String
    Description: >
      Public URL of this service. On first deploy you won't know this yet —
      deploy once with a placeholder (e.g. https://placeholder.example.com),
      read the real URL from the ServiceUrl stack output, then update this
      parameter (aws cloudformation update-stack) and redeploy.

  DatabaseUrlSecretArn:
    Type: String
    Description: >
      ARN of a Secrets Manager secret whose value is the full Postgres
      connection string (e.g. from Neon). Create it yourself first:
      aws secretsmanager create-secret --name vendor-sync/database-url --secret-string "postgresql://..."

  ShopifyApiSecretArn:
    Type: String
    Description: >
      ARN of a Secrets Manager secret whose value is the Shopify app's
      Client Secret.
      aws secretsmanager create-secret --name vendor-sync/shopify-api-secret --secret-string "..."

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ServiceName
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": { "type": "expire" }
              }
            ]
          }

  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-apprunner-ecr-access"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-apprunner-instance"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadAppSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseUrlSecretArn
                  - !Ref ShopifyApiSecretArn

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Ref ServiceName
      SourceConfiguration:
        AutoDeploymentsEnabled: true
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt EcrAccessRole.Arn
        ImageRepository:
          ImageRepositoryType: ECR
          ImageIdentifier: !Sub "${Repository.RepositoryUri}:${ImageTag}"
          ImageConfiguration:
            Port: "3000"
            RuntimeEnvironmentVariables:
              - Name: NODE_ENV
                Value: production
              - Name: SHOPIFY_API_KEY
                Value: !Ref ShopifyApiKey
              - Name: SCOPES
                Value: !Ref Scopes
              - Name: SHOPIFY_APP_URL
                Value: !Ref ShopifyAppUrl
            RuntimeEnvironmentSecrets:
              - Name: DATABASE_URL
                Value: !Ref DatabaseUrlSecretArn
              - Name: SHOPIFY_API_SECRET
                Value: !Ref ShopifyApiSecretArn
      InstanceConfiguration:
        Cpu: !Ref Cpu
        Memory: !Ref Memory
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5

Outputs:
  ServiceUrl:
    Description: >
      Public HTTPS URL App Runner assigned this service. Use this (or a
      custom domain pointed at it) as SHOPIFY_APP_URL and in
      shopify.app.toml's application_url / redirect_urls.
    Value: !Sub "https://${Service.ServiceUrl}"

  EcrRepositoryUri:
    Description: Push images here from CI.
    Value: !GetAtt Repository.RepositoryUri
