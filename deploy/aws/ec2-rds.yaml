AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Vendor Sync — alternative to app-runner.yaml. VPC + RDS Postgres (private
  subnet, no public access) + a single EC2 instance running the Docker image
  behind an Application Load Balancer that terminates TLS via ACM. Deploys
  independently of app-runner.yaml (its own VPC and ECR repo) so both can
  coexist if you want to compare them.

Parameters:
  ServiceName:
    Type: String
    Default: vendor-sync-ec2
    Description: Used to name/tag every resource in this stack.

  VpcCidr:
    Type: String
    Default: 10.20.0.0/16

  PublicSubnetACidr:
    Type: String
    Default: 10.20.0.0/24

  PublicSubnetBCidr:
    Type: String
    Default: 10.20.1.0/24

  InstanceType:
    Type: String
    Default: t3.micro
    Description: Free-tier eligible for the first 12 months on a new account.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Always resolves to the current Amazon Linux 2023 AMI for this region — no need to hardcode/update an AMI ID.

  DbInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: Free-tier eligible for the first 12 months on a new account.

  DbName:
    Type: String
    Default: vendor_sync

  DbUsername:
    Type: String
    Default: vendor_app

  DbAllocatedStorage:
    Type: Number
    Default: 20
    Description: GB. 20GB is the free-tier ceiling.

  DomainName:
    Type: String
    Description: >
      The hostname this app will be served at, e.g. app.example.com. ACM
      needs to issue a real certificate for it — a bare ALB DNS name can't
      have a trusted cert, and Shopify requires valid HTTPS.

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: >
      Route 53 hosted zone that owns DomainName's parent domain — used to
      auto-validate the ACM certificate and create the A record pointing at
      the load balancer. If your DNS isn't on Route 53, see
      deploy/README-ec2.md for the manual-validation path instead.

  ShopifyApiKey:
    Type: String
    Description: Shopify app's Client ID (public, matches shopify.app.toml).

  Scopes:
    Type: String
    Default: "read_products,write_products,read_inventory,write_inventory,read_locations,write_files"

  ShopifyApiSecretArn:
    Type: String
    Description: >
      ARN of a pre-created Secrets Manager secret holding the Shopify app's
      Client Secret:
      aws secretsmanager create-secret --name vendor-sync/shopify-api-secret --secret-string "..."

Resources:
  # ---------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-igw" }]

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-public-a" }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-public-b" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-public-rt" }]

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ------------------------------------------------------------ security
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB — public HTTP/HTTPS in
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 — only the ALB can reach the app port
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS — only the EC2 instance can reach Postgres
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref Ec2SecurityGroup
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  # ----------------------------------------------------------------- data
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ServiceName} DB subnets"
      SubnetIds: [!Ref PublicSubnetA, !Ref PublicSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref RdsSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      StorageEncrypted: true

  # ------------------------------------------------------------------ ecr
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ServiceName
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Expire untagged images after 7 days",
              "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7 },
              "action": { "type": "expire" }
            }]
          }

  # ------------------------------------------------------------------ ec2
  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-ec2-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Enables SSM Session Manager (shell access with no open port 22,
        # no SSH key to manage) and SSM Run Command (used for deploys).
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PullFromEcrAndReadSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref ShopifyApiSecretArn

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Ec2Role]

  Ec2Instance:
    Type: AWS::EC2::Instance
    DependsOn: Database
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds: [!Ref Ec2SecurityGroup]
      IamInstanceProfile: !Ref Ec2InstanceProfile
      Tags:
        - { Key: Name, Value: !Ref ServiceName }
        - { Key: App, Value: !Ref ServiceName } # deploy.yml targets this tag via SSM
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker jq
          systemctl enable --now docker

          mkdir -p /opt/vendor-sync
          cat > /opt/vendor-sync/deploy.sh <<'DEPLOY'
          #!/bin/bash
          set -euxo pipefail

          REGION="${AWS::Region}"
          ECR_URI="${Repository.RepositoryUri}"
          DB_SECRET_ARN="${Database.MasterUserSecret.SecretArn}"
          API_SECRET_ARN="${ShopifyApiSecretArn}"
          DB_HOST="${Database.Endpoint.Address}"
          DB_PORT="${Database.Endpoint.Port}"
          DB_NAME="${DbName}"

          aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"

          DB_SECRET_JSON=$(aws secretsmanager get-secret-value --region "$REGION" --secret-id "$DB_SECRET_ARN" --query SecretString --output text)
          DB_USER=$(echo "$DB_SECRET_JSON" | jq -r .username)
          DB_PASS=$(echo "$DB_SECRET_JSON" | jq -r .password)
          DATABASE_URL="postgresql://$DB_USER:$DB_PASS@$DB_HOST:$DB_PORT/$DB_NAME?sslmode=require"

          SHOPIFY_API_SECRET=$(aws secretsmanager get-secret-value --region "$REGION" --secret-id "$API_SECRET_ARN" --query SecretString --output text)

          docker pull "$ECR_URI:latest"
          docker stop app 2>/dev/null || true
          docker rm app 2>/dev/null || true
          docker run -d --name app --restart unless-stopped -p 3000:3000 \
            -e NODE_ENV=production \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SHOPIFY_API_KEY="${ShopifyApiKey}" \
            -e SHOPIFY_API_SECRET="$SHOPIFY_API_SECRET" \
            -e SCOPES="${Scopes}" \
            -e SHOPIFY_APP_URL="https://${DomainName}" \
            "$ECR_URI:latest"
          DEPLOY
          chmod +x /opt/vendor-sync/deploy.sh

          # First run — subsequent deploys are triggered by CI via SSM Run
          # Command (see .github/workflows/deploy-ec2.yml), which just
          # re-invokes this same script after a fresh `docker pull`.
          /opt/vendor-sync/deploy.sh

  # ------------------------------------------------------------------- alb
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ServiceName}-alb"
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      Scheme: internet-facing

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ServiceName}-tg"
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 3000
      TargetType: instance
      Targets: [{ Id: !Ref Ec2Instance, Port: 3000 }]
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates: [{ CertificateArn: !Ref Certificate }]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

Outputs:
  AppUrl:
    Value: !Sub "https://${DomainName}"
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Description: RDS-managed master credentials (auto-created, auto-rotatable).
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  EcrRepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  Ec2InstanceId:
    Value: !Ref Ec2Instance
