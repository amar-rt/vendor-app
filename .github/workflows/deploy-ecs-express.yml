name: Deploy (ECS Express Mode)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# If a second push lands while a deploy is still running, queue it rather
# than cancel — cancelling mid-`update-express-gateway-service` could leave
# the service in a half-rolled-out state.
concurrency:
  group: deploy-ecs-express
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC -> AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: vendor-sync-express
  STACK_NAME: vendor-sync-express

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx react-router typegen && npx tsc --noEmit
      - name: Lint
        run: npm run lint

  build-push-deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY: prints the actual OIDC token claims GitHub issues, so we
      # can compare them against the IAM role's trust policy directly
      # instead of guessing. Remove once the AssumeRoleWithWebIdentity
      # failure is resolved — no secret values are printed, only identity
      # claims (sub/aud/repository/ref), which are not sensitive.
      - name: Debug OIDC token claims
        run: |
          IDTOKEN=$(curl -sSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$IDTOKEN" | cut -d '.' -f2 | tr -- '-_' '+/')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, iss, repository, repository_owner, ref, event_name}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Update Express Mode service
        env:
          SERVICE_ARN: ${{ secrets.EXPRESS_SERVICE_ARN }}
          SHOPIFY_API_KEY: ${{ vars.SHOPIFY_API_KEY }}
          SHOPIFY_APP_URL: ${{ vars.SHOPIFY_APP_URL }}
          SHOPIFY_API_SECRET_ARN: ${{ secrets.SHOPIFY_API_SECRET_ARN }}
          IMAGE_TAG: latest
        run: ./deploy/aws/update-express-service.sh
